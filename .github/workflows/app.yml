# SteamGPTK fork build, updated 2026-10-15.
name: app

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: SteamGPTK app and tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NP_UI_BUILD_DIR: ${{ github.workspace }}/.build/free-ui
    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          swift --version
          cmake --version
          node --version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache pinned build dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/dobby
            ~/Library/Caches/steamgptk-free/downloads
            .build/free-ui
          key: steamgptk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-free-ui.sh', 'app/Package.swift', 'Makefile') }}

      - name: Build the free app without Apple runtime files
        run: ./scripts/build-free-ui.sh

      - name: Run C and profile checks
        run: |
          for check in sigcheck webpatch-fixtures panel-behavior compatcheck compatsvc-check \
            profilecheck spawn-env activatecheck overlay-shim-tests launchfixcheck bundlecheck; do
            log="$RUNNER_TEMP/steamgptk-$check.log"
            printf 'Running %s\n' "$check"
            if make -s "$check" 2>&1 | tee "$log"; then
              continue
            fi
            python3 - "$check" "$log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-80:])[:14000]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Native regression ' + sys.argv[1] + '::' + message)
          PY
            exit 1
          done

      - name: Run Swift tests without a user GPTK image
        run: |
          if ./scripts/test-free-ui.sh 2>&1 | tee "$RUNNER_TEMP/steamgptk-tests.log"; then
            exit 0
          fi
          python3 - "$RUNNER_TEMP/steamgptk-tests.log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          reports = 0
          for index, line in enumerate(lines):
              if 'recorded an issue' in line or 'error:' in line:
                  message = '\n'.join(lines[index:index + 8])[:3000]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Swift regression::' + message)
                  reports += 1
                  if reports == 10:
                      break
          PY
          exit 1

      - name: Check relocated app resources without opening UI
        run: ./scripts/check-packaged-ui.sh out/SteamGPTK.app

      - name: Package and verify
        run: |
          codesign --verify --deep --strict out/SteamGPTK.app
          mkdir -p out/artifact
          ditto -c -k --keepParent out/SteamGPTK.app out/artifact/SteamGPTK.zip
          cd out/artifact
          shasum -a 256 SteamGPTK.zip > SteamGPTK.zip.sha256
          unzip -tq SteamGPTK.zip

      - name: Check the app extracted from the shipping archive
        run: |
          ditto -x -k out/artifact/SteamGPTK.zip "$RUNNER_TEMP/steamgptk-shipping"
          ./scripts/check-packaged-ui.sh "$RUNNER_TEMP/steamgptk-shipping/SteamGPTK.app"

      - name: Upload app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SteamGPTK
          path: out/artifact
          if-no-files-found: error
