# SteamGPTK draft releases, updated 2026-10-15.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New tag, for example steamgptk-v0.1.0
        required: true
        type: string
      release_notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/app.yml

  release:
    name: create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SteamGPTK
          path: release

      - name: Verify artifact checksum
        run: |
          cd release
          sha256sum -c SteamGPTK.zip.sha256
          unzip -tq SteamGPTK.zip

      - name: Create a new draft without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in steamgptk-v[0-9]*) ;; *) echo 'Use a steamgptk-v version tag'; exit 1 ;; esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          [ -z "$existing_tag" ] || { echo 'Choose a new tag: this tag already exists'; exit 1; }
          printf '%s\n' "$RELEASE_NOTES" > release/notes.txt
          gh release create "$RELEASE_TAG" \
            release/SteamGPTK.zip release/SteamGPTK.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "$RELEASE_TAG" --notes-file release/notes.txt
